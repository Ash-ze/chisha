# 今天吃啥 · 群投票 API（Cloudflare Worker + KV）
# 部署前请把 id / preview_id 换成你自己 `wrangler kv namespace create POLLS` 得到的值。
# 本文件不包含任何密钥。
name = "chisha-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[kv_namespaces]]
binding = "POLLS"
id = "00000000000000000000000000000000"
preview_id = "11111111111111111111111111111111"

[vars]
# 允许跨域访问的前端来源（协议 + 域名，不含路径），多个用英文逗号分隔。
# 默认只允许 GitHub Pages 上的前端；换成你自己的静态站地址，例如 "https://你的用户名.github.io"。
# 不在列表里的网站发来的浏览器请求会被拒绝（403）。不建议用 "*"（任意来源）。
# 本地开发时 `npm run dev:worker` 会用 --var 临时放行 localhost:5173。
ALLOWED_ORIGINS = "https://ash-ze.github.io"
